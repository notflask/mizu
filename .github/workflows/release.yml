name: Release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

env:
  CARGO_TERM_COLOR: always

jobs:
  linux:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: Dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            libclang-dev clang pkg-config libfontconfig1-dev libfreetype6-dev \
            libwayland-dev libxkbcommon-dev libx11-dev libxcursor-dev libxi-dev libxrandr-dev
      - run: cargo build --release --locked
      - name: Binary size budget
        run: |
          size=$(stat -c %s target/release/mizu)
          echo "mizu is $size bytes"
          test "$size" -lt 31457280   # 30 MiB
      - name: Package
        run: |
          v=${GITHUB_REF_NAME:-dev}
          d=mizu-$v-linux-x86_64
          mkdir -p $d/share/applications $d/share/icons
          cp target/release/mizu LICENSE README.md $d/
          cp packaging/linux/io.github.notflask.Mizu.desktop $d/share/applications/
          cp -r assets/icons/generated/linux/hicolor $d/share/icons/
          tar czf $d.tar.gz $d
      - uses: actions/upload-artifact@v4
        with:
          name: linux
          path: "*.tar.gz"

  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: LLVM for bindgen
        shell: bash
        run: echo "LIBCLANG_PATH=C:\\Program Files\\LLVM\\bin" >> "$GITHUB_ENV"
      - run: cargo build --release --locked
      - name: Package
        shell: pwsh
        run: |
          $v = if ($env:GITHUB_REF_NAME) { $env:GITHUB_REF_NAME } else { "dev" }
          $d = "mizu-$v-windows-x86_64"
          New-Item -ItemType Directory $d | Out-Null
          Copy-Item target/release/mizu.exe, LICENSE, README.md $d
          Compress-Archive -Path $d -DestinationPath "$d.zip"
      - uses: actions/upload-artifact@v4
        with:
          name: windows
          path: "*.zip"

  macos:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-apple-darwin,x86_64-apple-darwin
      - uses: Swatinem/rust-cache@v2
      - run: |
          cargo build --release --locked --target aarch64-apple-darwin
          cargo build --release --locked --target x86_64-apple-darwin
      - name: Bundle
        run: |
          v=${GITHUB_REF_NAME:-dev}
          app=mizu.app
          mkdir -p $app/Contents/MacOS $app/Contents/Resources
          lipo -create -output $app/Contents/MacOS/mizu \
            target/aarch64-apple-darwin/release/mizu target/x86_64-apple-darwin/release/mizu
          sed "s/@VERSION@/${v#v}/g" packaging/macos/Info.plist > $app/Contents/Info.plist
          cp assets/icons/generated/macos/mizu.icns $app/Contents/Resources/mizu.icns
          # Notarise when the Apple secrets exist, otherwise sign ad hoc.
          if [ -n "${{ secrets.APPLE_CERT_P12 }}" ]; then
            echo "${{ secrets.APPLE_CERT_P12 }}" | base64 --decode > cert.p12
            security create-keychain -p ci build.keychain
            security default-keychain -s build.keychain
            security unlock-keychain -p ci build.keychain
            security import cert.p12 -k build.keychain -P "${{ secrets.APPLE_CERT_PASSWORD }}" -T /usr/bin/codesign
            security set-key-partition-list -S apple-tool:,apple: -s -k ci build.keychain
            id=$(security find-identity -v -p codesigning build.keychain | head -1 | awk '{print $2}')
            codesign --force --options runtime --timestamp --sign "$id" $app
            ditto -c -k --keepParent $app notarize.zip
            xcrun notarytool submit notarize.zip --wait \
              --apple-id "${{ secrets.APPLE_ID }}" --team-id "${{ secrets.APPLE_TEAM_ID }}" \
              --password "${{ secrets.APPLE_APP_PASSWORD }}"
            xcrun stapler staple $app
          else
            codesign --force --deep --sign - $app
          fi
          hdiutil create -volname mizu -srcfolder $app -ov -format UDZO mizu-$v-macos-universal.dmg
      - uses: actions/upload-artifact@v4
        with:
          name: macos
          path: "*.dmg"

  publish:
    needs: [linux, windows, macos]
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true
      - uses: softprops/action-gh-release@v2
        with:
          files: dist/*
          generate_release_notes: true
